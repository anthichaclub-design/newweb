(function(){try{

var nativeFetch=window.fetch;
window.fetch=function(url,opts){
try{
var u=(typeof url==="string"?url:(url&&url.url?url.url:""));
if(u==="actions"||u.endsWith("/actions")){
var body=opts&&opts.body?JSON.parse(opts.body):{};

}

if(idx>=0){arr[idx].value=args.value;}else{arr.push({id:id2,value:args.value});}
store[coll]=arr;save(store);result={id:id2};
}

else if(action==="records.delete"){store[coll]=arr.filter(function(r){return r.id!==args.id;});save(store);result=true;}
else{result={};}
return Promise.resolve(new Response(JSON.stringify({data:result}),{status:200,headers:{"content-type":"application/json"}}));
}}
}catch(e){}
return nativeFetch.apply(window,arguments);
};
}catch(e){}})();

return '<div style="background:#fff;border-radius:16px;padding:14px"><div style="text-align:center;font-size:48px">'+(img?'<img src="'+esc(img)+'" style="width:100%;height:180px;object-fit:cover;border-radius:12px">':'🛍️')+'</div><h3 style="margin:8px 0 4px">'+esc(pr.name||"สินค้า")+'</h3><p style="color:#666;font-size:14px">'+esc(pr.desc||"")+'</p><p style="font-weight:800;color:#2E7D32;font-size:18px">'+(pr.price||0)+' ฿</p><p style="font-size:13px;color:#666">สถานะ: '+esc(pr.status||"มีของ")+'</p></div>';
}).join("");
wrap.innerHTML='<div style="background:#2E7D32;color:#fff;border-radius:20px;padding:22px"><p style="margin:0;font-size:13px">ร้านค้าออนไลน์ • '+esc(found.code||"")+'</p><h1 style="margin:6px 0;font-size:34px">'+esc(found.name||"ร้านค้า")+'</h1><p>'+esc(found.slogan||"")+'</p><p style="opacity:.95">'+esc(found.shopDesc||"")+'</p><p style="font-size:13px;opacity:.9">LINE: '+esc(found.line||found.lineId||"-")+' • โทร: '+esc(found.phone||"-")+'</p></div>'
+'<div style="background:#fff;border-radius:16px;padding:16px;margin-top:14px"><h3>B1 • ประวัติร้าน</h3><p>'+esc(found.b1Text||"")+'</p></div>'
+'<div style="margin-top:14px"><h2>สินค้าของร้าน</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+(prods||"<p>ยังไม่มีสินค้า</p>")+'</div></div>'
+'<div style="background:#E8F5E9;border-radius:14px;padding:14px;margin-top:14px"><b>ลิงก์ร้านนี้:</b> '+esc(location.href)+'<br><a href="/" style="color:#2E7D32;font-weight:700">← กลับหน้าแรก ATC</a></div>';
document.body.appendChild(wrap);
}catch(e){}
}
// --- Admin panel: ปุ่มลอย ATC ---
function createPanel(){
if(document.getElementById("atc-auto-btn"))return;
var btn=document.createElement("button");btn.id="atc-auto-btn";btn.textContent="ATC: สร้างลิงก์ + ส่งอีเมล";
btn.style.cssText="position:fixed;right:16px;bottom:16px;z-index:9999;background:#1B5E20;color:#fff;border:0;padding:12px 16px;border-radius:999px;font-family:Prompt,sans-serif;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.25)";
btn.onclick=function(){var m=document.getElementById("atc-auto-modal");if(m)m.style.display=m.style.display==="none"?"block":"none";refreshShops();};
document.body.appendChild(btn);
var modal=document.createElement("div");modal.id="atc-auto-modal";modal.style.cssText="display:none;position:fixed;right:16px;bottom:70px;z-index:9999;width:380px;max-width:calc(100vw - 32px);background:#fff;border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.25);padding:16px;font-family:Prompt,sans-serif";
modal.innerHTML='<h3 style="margin:0 0 6px">สร้างลิงก์อัตโนมัติ — ลูกค้าคนที่ 2+</h3>'
+'<p style="font-size:13px;color:#666;margin:0 0 10px">ขั้นตอน: ลูกค้าแต่งใน Builder แล้วกด <b>บันทึก</b> → คุณเช็กยอด 9 บาทในแอปธนาคาร → เลือกร้านด้านล่าง → กดยืนยัน ระบบจะสร้างลิงก์ + เปิดอีเมลให้ส่งเอง (ไม่ต้องกด Deploy ใน Vercel)</p>'
+'<label style="font-size:13px;font-weight:700">เลือกร้านที่จ่ายแล้ว</label><select id="atc-auto-shop" style="width:100%;padding:10px;border:1.5px solid #C8E6C9;border-radius:10px;margin:4px 0 10px"></select>'
+'<label style="font-size:13px;font-weight:700">อีเมลลูกค้า (จาก Builder)</label><input id="atc-auto-email" style="width:100%;padding:10px;border:1.5px solid #C8E6C9;border-radius:10px;margin:4px 0 10px" placeholder="ลูกค้า@...">'
+'<label style="font-size:13px;font-weight:700">ชื่อท้ายลิงก์ (subdomain)</label><input id="atc-auto-slug" style="width:100%;padding:10px;border:1.5px solid #C8E6C9;border-radius:10px;margin:4px 0 10px" placeholder="เช่น sudsai-beauty">'
+'<button id="atc-auto-confirm" style="width:100%;background:#2E7D32;color:#fff;border:0;padding:12px;border-radius:999px;font-weight:700;cursor:pointer">ยืนยันได้รับเงิน 9 บาท → สร้างลิงก์ + ส่งอีเมล</button>'
+'<div id="atc-auto-result" style="margin-top:12px;font-size:14px"></div>'
+'<p style="font-size:12px;color:#888;margin-top:10px">หมายเหตุ: Vercel แบบไฟล์นิ่งส่งอีเมลจากเซิร์ฟเวอร์เองไม่ได้ ระบบจะเปิดแอปอีเมลของคุณพร้อมข้อความที่เขียนไว้ให้แล้ว คุณกด Send 1 ครั้ง ลูกค้าจะได้รับอีเมลเลย ไม่ต้องพิมพ์เอง</p>';
document.body.appendChild(modal);
document.getElementById("atc-auto-shop").onchange=onShopChange;
document.getElementById("atc-auto-confirm").onclick=onConfirm;
}
async function refreshShops(){
var sel=document.getElementById("atc-auto-shop");if(!sel)return;
var shops=await listShops();
if(!shops.length){sel.innerHTML='<option value="">ยังไม่มีร้านที่บันทึก — ให้ลูกค้าแต่งใน Builder แล้วกด บันทึก ก่อน</option>';showResult("");return;}
sel.innerHTML=shops.map(function(s){var v=s.value||{};return '<option value="'+esc(s.id)+'">'+esc(v.code||"")+' • '+esc(v.name||"ร้าน")+' • '+(v.paid?"จ่ายแล้ว":"ยังไม่ยืนยัน")+'</option>';}).join("");
onShopChange();
}
async function onShopChange(){
var sel=document.getElementById("atc-auto-shop");if(!sel||!sel.value)return;
var shops=await listShops();var f=shops.find(function(s){return s.id===sel.value;});if(!f)return;
var v=f.value||{};
document.getElementById("atc-auto-email").value=v.email||v.paymentEmail||"";
document.getElementById("atc-auto-slug").value=v.subdomain||slugify(v.name||"");
}
async function onConfirm(){
try{
var sel=document.getElementById("atc-auto-shop");if(!sel||!sel.value){alert("เลือกร้านก่อน");return;}
var email=document.getElementById("atc-auto-email").value.trim();
var slug=slugify(document.getElementById("atc-auto-slug").value||"");
if(!email||email.indexOf("@")===-1){alert("ใส่อีเมลลูกค้าให้ถูกต้องก่อน");return;}
if(!slug){alert("ใส่ชื่อท้ายลิงก์ก่อน");return;}
var shops=await listShops();var f=shops.find(function(s){return s.id===sel.value;});if(!f){alert("ไม่พบร้านนี้");return;}
var v=f.value||{};
// หารหัสใหม่ ถ้ายังไม่มี: ATC-1004, 1005...
var maxCode=1003;shops.forEach(function(s){var c=(s.value&&s.value.code)||"";var n=parseInt(c.replace(/[^0-9]/g,""),10);if(!isNaN(n)&&n>maxCode)maxCode=n;});
if(!v.code||v.code.indexOf("ATC-")===-1||v.paid!==true){
if(!v.code||v.code.indexOf("ATC-")===-1){v.code="ATC-"+(maxCode+1);}
}
v.paid=true;v.status="จ่ายแล้ว";v.subdomain=slug;v.email=email;
// บันทึกถาวรผ่านระบบเดิม (fetch interceptor จะเก็บลง localStorage)
await callRecords("records.replace",{collection:"atc_shops",id:f.id,value:v});
var link=location.origin+"/"+slug;
var em=buildEmail(v,link,v.code);
var mailto="mailto:"+encodeURIComponent(email)+"?subject="+encodeURIComponent(em.subject)+"&body="+encodeURIComponent(em.body);
showResult('<div style="background:#E8F5E9;border-radius:12px;padding:12px"><b>✅ สร้างลิงก์แล้ว</b><br>รหัสร้าน: <b>'+esc(v.code)+'</b><br>ลิงก์: <a href="'+esc(link)+'" target="_blank">'+esc(link)+'</a><br>อีเมลที่จะส่งถึง: '+esc(email)+'<br><br><button onclick="window.open(\''+mailto.replace(/'/g,"\\'")+'\')" style="background:#2E7D32;color:#fff;border:0;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer">📧 เปิดแอปอีเมล + ส่งเลย</button> <button onclick="navigator.clipboard.writeText(\''+link.replace(/'/g,"\\'")+'\').then(function(){alert(\'คัดลอกลิงก์แล้ว\')})" style="background:#fff;border:1.5px solid #2E7D32;color:#2E7D32;padding:10px 14px;border-radius:999px;font-weight:700;cursor:pointer">คัดลอกลิงก์</button><br><br><b>ข้อความอีเมล:</b><pre style="white-space:pre-wrap;background:#fff;border-radius:10px;padding:10px;font-size:13px">'+esc(em.body)+'</pre><button onclick="navigator.clipboard.writeText(document.getElementById(\'atc-email-body\').textContent).then(function(){alert(\'คัดลอกข้อความอีเมลแล้ว\')})" style="background:#fff;border:1.5px solid #2E7D32;color:#2E7D32;padding:8px 12px;border-radius:999px;font-weight:600;cursor:pointer">คัดลอกข้อความอีเมล</button><span id="atc-email-body" style="display:none">'+esc(em.body)+'</span></div>');
window.open(mailto,"_blank");
}catch(e){alert("สร้างลิงก์ไม่สำเร็จ: "+(e&&e.message?e.message:e));}
}
if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",function(){createPanel();handleDeepLink();});}else{createPanel();handleDeepLink();}
}catch(e){}})();
</script>
